  Ionic pages and navigation.

<ion-header no-border>

  <ion-navbar>
    <ion-title>guest</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
    <h2>Welcome Back!</h2>
    <p>######################!</p>


    <form (ngSubmit)="checkoutAsGuest()" [formGroup]="guestCheckoutForm">
        <ion-list>
            <ion-item no-padding>
                <ion-label floating>Guest First Name</ion-label>
                <ion-input type="text" formControlName="guest-first-name"></ion-input>
            </ion-item>
            <div class="form-control-feedback" *ngIf="!guestCheckoutForm.controls['guest-first-name'].valid && guestCheckoutForm.controls['guest-first-name'].dirty">This
                field is required.</div>
            <ion-item no-padding>
                <ion-label floating>Guest Last Name</ion-label>
                <ion-input type="text" formControlName="guest-last-name"></ion-input>
            </ion-item>
            <div class="form-control-feedback" *ngIf="!guestCheckoutForm.controls['guest-last-name'].valid && guestCheckoutForm.controls['guest-last-name'].dirty">This
                field is required.</div>
            <ion-item no-padding>
                <ion-label floating>Guest Email</ion-label>
                <ion-input type="text" formControlName="guest-email"></ion-input>
                <ion-icon *ngIf="!guestCheckoutForm.controls['guest-email'].valid && guestCheckoutForm.controls['guest-email'].dirty"
                    name="alert" item-right class="has-error"></ion-icon>
            </ion-item>
            <div class="form-control-feedback" *ngIf="!guestCheckoutForm.controls['guest-email'].valid && guestCheckoutForm.controls['guest-email'].dirty">Please
                enter valid email address.</div>
            <ion-row>
                <ion-col no-padding class="spacing">
                    <button type="submit" ion-button block no-border [disabled]="!guestCheckoutForm.valid" color="red"
                        class="login-button">
                        Continue As Guest
                    </button>
                </ion-col>
                <ion-col no-padding>
                    <button ion-button block no-border color="red" class="login-button" [navPush]="'LoginPage'">
                        Go To Log In
                    </button>
                </ion-col>
            </ion-row>
        </ion-list>
    </form>




</ion-content>
