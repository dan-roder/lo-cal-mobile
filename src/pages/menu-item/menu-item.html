<ion-header no-shadow no-border>
    <ion-navbar transparent>
        <button ion-button menuToggle>
            <ion-icon name="hamburger-menu" class="small-icon"></ion-icon>
        </button>
    </ion-navbar>
</ion-header>

<ion-content no-padding>
    <div class="menu-item-header" *ngIf="menuItem">
        <div class="title-box">
            <h2 class="menu-item-title">{{ menuItem.Name }}</h2>
            <p class="menu-item-description">
                {{ menuItem.Description }}
            </p>
            <ion-row class="menu-item-meta">
                <ion-col col-3 class="border">
                    <span class="price">$12.99</span>
                </ion-col>
                <ion-col col-4 text-center class="border">
                    <span class="calories">360 cal</span>
                </ion-col>
                <ion-col text-center>
                    <span class="allergen">
                        <ion-icon name="vegan"></ion-icon>
                        <ion-icon name="paleo"></ion-icon>
                        <ion-icon name="veget"></ion-icon>
                    </span>
                </ion-col>
            </ion-row>
        </div>
    </div>
</ion-content>
