<ion-content>

  <div padding>
    <h1>Category</h1>
    <!-- <button ion-button (click)="pushPage(1)">Push page</button> -->
    <ion-grid>
      <ion-row>
        <ion-col col-4 *ngFor="let category of categories; let i = index" no-margin>
          <ion-card (click)="pushPage(i)" no-margin class="full-width no-shadow light-background">
          <img src="http://lorempixel.com/400/200/food" />
            <ion-card-content>

                {{category.title}}

            </ion-card-content>

          </ion-card>

        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
