<ion-header no-border>
    <ion-navbar>
      <button ion-button menuToggle>
        <ion-icon name="hamburger-menu" class="small-icon"></ion-icon>
      </button>
      <ion-title>Review Your Order</ion-title>
    </ion-navbar>
  </ion-header>

<ion-content padding>
    <ion-list class="bag-items" no-margin *ngIf="itemsInBag.length">
        <div class="bag-item" *ngFor="let item of itemsInBag; let i = index">
            <ion-row>
                <ion-col col-3 no-padding>
                    <img *ngIf="item.CartImage" [src]="item.CartImage" alt="bag item" class="bag-item-image" />
                    <div tappable class="remove" (tap)="removeItem( item, i )">
                        <ion-icon name="close" class="remove-icon"></ion-icon>
                    </div>
                </ion-col>
                <ion-col>
                    <div class="bag-item-title">
                        <ion-row>
                            <ion-col>
                                {{ item.Name }}
                                <span class="bag-item-quantity">x{{ item.Quantity }}</span>
                            </ion-col>
                            <!-- <ion-col class="bag-item-edit" text-center (tap)="goToItem(item, i)">
                                Edit
                            </ion-col> -->
                        </ion-row>
                    </div>
                    <p class="bag-item-description">
                        {{ (item.ShortDescription | allergens).description }}
                    </p>
                    <ion-row class="bag-item-meta">
                        <ion-col col-3 class="border">
                            <span class="price">{{ item.ExtendedPrice | currency:'USD':'symbol' }}</span>
                        </ion-col>
                        <ion-col col-4 text-center class="border">
                            <span class="calories" *ngIf="item.caloricValue !== null && item.caloricValue !== 0">{{
                                item.caloricValue }} cal</span>
                        </ion-col>
                        <ion-col col-5 text-center>
                            <span class="allergen">
                                <span class="allergen" *ngFor="let allergen of (item.ShortDescription | allergens)?.allergens">
                                    {{ allergen }}
                                </span>
                                <!-- <ion-icon name="vegan"></ion-icon>
                                <ion-icon name="paleo"></ion-icon>
                                <ion-icon name="veget"></ion-icon> -->
                            </span>
                        </ion-col>
                    </ion-row>
                </ion-col>
            </ion-row>
        </div>
    </ion-list>
</ion-content>
