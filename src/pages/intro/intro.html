<ion-content padding>
  <ion-slides pager="true">

    <ion-slide>
      <div class="slide-1">
        <div class="slide-content top">
          <h1>Food<br>
          That<br>
          <span class="red">Counts</span></h1>
        </div>
        <div class="slide-image">
          <img src="assets/images/slide1@3x.png">
        </div>
        <div class="slide-content bottom">
            <p>Some foods are better than others.
            We focus on the better.
            </p>
        </div>
      </div>
    </ion-slide>

    <ion-slide>
      <div class="slide-2">
        <div class="slide-content top">
            <h1>Great<br/>
              <span class="red">Taste</span>
            </h1>
        </div>
        <div class="slide-image">
        </div>
        <div class="slide-content bottom">
            <p>Eating is one of the great pleasures in life and we aim to keep it that way.</p>
        </div>
      </div>
    </ion-slide>

    <ion-slide>
      <div class="slide-3">
        <div class="slide-content top">
            <h1>Best<br />
              <span class="red">Ingredients</span>
            </h1>
        </div>
        <div class="slide-image">
        </div>
        <div class="slide-content bottom">
            <p>Lean meats, quality carbs, healthy fats, fiber, and an abundance of veggies.</p>
        </div>
      </div>
    </ion-slide>

  </ion-slides>

  <div class="bottom-buttons-wrap">
    <button ion-button block color="dark" (click)="navHome()" class="order-now">
      Order Now
    </button>
    <ion-grid>
      <ion-row>
        <ion-col class="bottom-links-col">
          <a href="#" class="bottom-link" [navPush]="'LoginPage'">log in</a>
        </ion-col>
        <ion-col class="bottom-links-col">
          <a href="#" class="bottom-link" [navPush]="'SignupPage'">new account</a>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
