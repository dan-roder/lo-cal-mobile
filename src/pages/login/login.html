<ion-header no-border>
    <ion-navbar>
      <ion-title></ion-title>
    </ion-navbar>
  </ion-header>


<ion-content padding>
    <h2>Welcome Back!</h2>
    <p>Log in now to explore the menu and place your order!</p>
    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
        <ion-list>
            <ion-item [ngClass]="{'has-error':!loginForm.controls['email'].valid}" no-padding>
                <ion-label stacked>Email</ion-label>
                <ion-input type="email" name="email" formControlName="email"></ion-input>
            </ion-item>
            <ion-item [ngClass]="{'has-error':!loginForm.controls['password'].valid}" no-padding>
                <ion-label stacked>Password</ion-label>
                <ion-input type="password" name="password" formControlName="password"></ion-input>
            </ion-item>
            <ion-row>
                <ion-col col-6>
                    <button type="submit" ion-button block icon-left [disabled]="!loginForm.valid" color="orange">
                        <ion-icon name="log-in"></ion-icon>
                        Log In
                    </button>
                </ion-col>
            </ion-row>
        </ion-list>
    </form>
</ion-content>
